server:
  port: 8081

spring:
  application:
    name: multi-agent-github-review

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:github_review}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/
      file-extensions: .graphqls

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  temporal:
    connection:
      target: ${TEMPORAL_HOST:localhost}:7233
    workers:
      - name: code-review-worker
        task-queue: code-review-queue
        workflow-classes:
          - com.multiagent.review.temporal.workflow.CodeReviewWorkflowImpl
        activity-beans:
          - gitHubActivitiesImpl
          - LLMActivitiesImpl
          - notificationActivitiesImpl

# ── LangChain4j / OpenAI ────────────────────────────────────────────────────
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-4o
      temperature: 0.1
      max-tokens: 4096
      response-format: json_object

# ── GitHub ───────────────────────────────────────────────────────────────────
github:
  token: ${GITHUB_TOKEN}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}

# ── App ──────────────────────────────────────────────────────────────────────
app:
  email:
    from: ${APP_EMAIL_FROM:noreply@codereview.ai}
    to: ${APP_EMAIL_TO}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:false}
    cron: ${SCHEDULER_CRON:0 0 2 * * *}
    branch: ${SCHEDULER_BRANCH:main}
    repos: ${SCHEDULER_REPOS:}

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.multiagent: INFO
    io.temporal: WARN
    dev.langchain4j: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [corrId=%X{correlationId}] [wfId=%X{workflowId}] [runId=%X{runId}] %logger{36} - %msg%n"
