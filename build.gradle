plugins {
    id 'java'
    id 'org.springframework.boot'           version '3.3.4'
    id 'io.spring.dependency-management'    version '1.1.6'
}

group   = 'com.multiagent'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    langchain4jVersion  = '0.35.0'
    temporalVersion     = '1.24.2'
    githubApiVersion    = '1.321'
    mapstructVersion    = '1.5.5.Final'
    elasticLogVersion   = '1.6.0'
}

dependencies {

    // ── Spring Boot ───────────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ── LangChain4j ───────────────────────────────────────────────────────
    implementation "dev.langchain4j:langchain4j-spring-boot-starter:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai-spring-boot-starter:${langchain4jVersion}"

    // ── Temporal ──────────────────────────────────────────────────────────
    implementation "io.temporal:temporal-sdk:${temporalVersion}"
    implementation "io.temporal:temporal-spring-boot-autoconfigure:${temporalVersion}"

    // ── GitHub API ────────────────────────────────────────────────────────
    implementation "org.kohsuke:github-api:${githubApiVersion}"

    // ── Database ──────────────────────────────────────────────────────────
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // ── Utilities ─────────────────────────────────────────────────────────
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // ── Structured Logging ────────────────────────────────────────────────
    implementation "co.elastic.logging:logback-ecs-encoder:${elasticLogVersion}"

    // ── Test ──────────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.temporal:temporal-testing:${temporalVersion}"
    testImplementation "io.temporal:temporal-spring-boot-autoconfigure:${temporalVersion}"
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
