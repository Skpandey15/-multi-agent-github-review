# DO NOT commit real secrets here.
# This file is a template — the deploy.sh script substitutes real values from .env at deploy time.
#
# To apply manually:
#   kubectl create secret generic code-review-secret --namespace=code-review \
#     --from-literal=GITHUB_TOKEN="<your-github-pat>" \
#     --from-literal=OPENAI_API_KEY="<your-openai-key>" \
#     --from-literal=GMAIL_USERNAME="<your-gmail>" \
#     --from-literal=GMAIL_APP_PASSWORD="<your-app-password>" \
#     --from-literal=GITHUB_WEBHOOK_SECRET="<your-webhook-secret>" \
#     --from-literal=DB_PASSWORD="postgres"
apiVersion: v1
kind: Secret
metadata:
  name: code-review-secret
  namespace: code-review
type: Opaque
stringData:
  GITHUB_TOKEN: "REPLACE_WITH_GITHUB_TOKEN"
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  GMAIL_USERNAME: "REPLACE_WITH_GMAIL_USERNAME"
  GMAIL_APP_PASSWORD: "REPLACE_WITH_GMAIL_APP_PASSWORD"
  GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET"
  DB_PASSWORD: "postgres"
