apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-app
  namespace: code-review
  labels:
    app: code-review-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-review-app
  template:
    metadata:
      labels:
        app: code-review-app
    spec:
      initContainers:
        - name: wait-for-temporal
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z temporal 7233; do echo waiting for temporal; sleep 3; done']
      containers:
        - name: app
          image: localhost:30500/code-review-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: code-review-config
            - secretRef:
                name: code-review-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: code-review-app
  namespace: code-review
spec:
  selector:
    app: code-review-app
  ports:
    - port: 8081
      targetPort: 8081
