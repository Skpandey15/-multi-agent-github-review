apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-review-ingress
  namespace: code-review
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: code-review.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-review-app
                port:
                  number: 8081
    - host: temporal-ui.code-review.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui
                port:
                  number: 8080
